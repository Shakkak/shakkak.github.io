project:
  type: website
  output-dir: ../projects        # rendered HTML, committed and served by GitHub Pages
  resources:
    - assets/plotly.min.js

website:
  title: "Blog"
  site-url: https://shakkak.github.io/projects
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: "Home"
        href: ../index.html
      - text: "All posts"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/Shakkak
  page-footer: "Shakib Hosseinzadeh"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    smooth-scroll: true

execute:
  freeze: auto                   # re-run a notebook only when its source changes
