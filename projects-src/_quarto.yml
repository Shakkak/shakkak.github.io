project:
  type: website
  output-dir: ../projects        # rendered HTML, committed and served by GitHub Pages
  resources:
    - assets/plotly.min.js

website:
  title: "Blog"
  site-url: https://shakkak.github.io/projects
  open-graph: true
  twitter-card: true
  page-footer: "Shakib Hosseinzadeh"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    include-in-header: site-head.html
    include-before-body: site-nav.html
    toc: true
    code-fold: true
    code-tools: false
    smooth-scroll: true

execute:
  freeze: auto                   # re-run a notebook only when its source changes
